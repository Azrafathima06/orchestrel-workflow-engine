[project]
name = "workflow-engine-backend"
version = "0.1.0"
description = "Distributed Workflow Orchestration & Automation Engine - backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "structlog>=24.4,<25",
    "redis>=5.1,<6",
    "alembic>=1.14,<2",
    "celery>=5.4,<6",
    # Supervises web + worker + beat inside the single production Web
    # Service (Render's free tier has no Background Workers). Chosen over
    # supervisord because it terminates the whole process group when any
    # child exits, so a dead API takes the container down instead of
    # leaving it superficially healthy.
    "honcho>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "httpx>=0.27,<0.28",
    "ruff>=0.7,<0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic revision files are machine-generated by `alembic revision
# --autogenerate` and reviewed for correctness, not hand-formatted to
# house style; re-wrapping them defeats the point of autogeneration.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is `x: T = Depends(...)` in the
# signature. B008 flags function calls in argument defaults, which is the
# right rule in general but wrong for these specific FastAPI markers.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
