services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workflow_engine}
      POSTGRES_USER: ${POSTGRES_USER:-workflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workflow}
    ports:
      # Exposed for local tooling (psql, Alembic, running tests from the
      # host) — not required to run the stack itself. Production talks to
      # Neon over the network, not this port.
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workflow} -d ${POSTGRES_DB:-workflow_engine}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Startup is explicitly staged so nothing races schema creation:
  #   postgres healthy -> migrate -> seed -> (api, worker)
  # Both migrate and seed are idempotent and exit 0, so `up` is repeatable.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: alembic upgrade head
    env_file:
      - .env
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-workflow}:${POSTGRES_PASSWORD:-workflow}@postgres:5432/${POSTGRES_DB:-workflow_engine}
      BROKER_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.seed
    env_file:
      - .env
    environment: *backend_env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment: *backend_env
    volumes:
      - ./backend/app:/app/app
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # --concurrency=1: one execution slot per container, so worker_id
    # ("hostname:pid") maps one-to-one onto a container. Distribution
    # evidence is then unambiguous — N distinct worker_ids means N distinct
    # containers actually executed work, with no ambiguity about whether
    # they were prefork children of a single process.
    # -Q tasks,orchestrator: both queues on the same worker pool locally.
    command: >
      celery -A app.worker.celery_app worker
      --loglevel=info
      --concurrency=1
      -Q tasks,orchestrator
    env_file:
      - .env
    environment: *backend_env
    volumes:
      - ./backend/app:/app/app
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # NOTE: deliberately no `container_name` and no host port mapping.
    # Either one makes the service unscalable, and this is the service we
    # scale: `docker compose up -d --scale worker=3`.

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Exactly one Beat, ever. Two would double every recovery tick. Its only
    # job is to emit scheduler_tick on an interval — all recovery logic lives
    # in PostgreSQL queries, not in Beat's schedule.
    # --schedule writes Beat's last-run bookkeeping to a path the non-root
    # container user can write. Losing that file is harmless: our schedule is
    # static (one recovery tick), so a restart just fires the next tick
    # immediately, and the sweep is idempotent.
    command: >
      celery -A app.worker.celery_app beat
      --loglevel=info
      --schedule=/tmp/celerybeat-schedule
    env_file:
      - .env
    environment: *backend_env
    volumes:
      - ./backend/app:/app/app
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install --silent && npm run dev -- --host"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  frontend_node_modules:
